<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumpulan Bukti Nyata</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="badge">EKSKLUSIF PRIA DEWASA</div>
        <h1>BUKTI NYATA</h1>
        <p>Ribuan pria telah membuktikan khasiatnya. Kini giliran Bapak!</p>
    </header>

    <main class="container">
        <!-- Section Hasil Produk -->
        <section class="gallery-section">
            <div class="section-title">
                <h2>🔥 Hasil Pemakaian</h2>
                <p>Perubahan nyata tanpa rekayasa. Klik foto untuk memperbesar.</p>
            </div>
            <div class="grid-gallery-2">
                <!-- Diperbanyak gambar hasilnya -->
                <div class="img-wrapper"><img src="assets/1.jpg" alt="Hasil 1" class="zoomable"></div>
                <div class="img-wrapper"><img src="assets/2.jpg" alt="Hasil 2" class="zoomable"></div>
                <div class="img-wrapper"><img src="assets/3.jpg" alt="Hasil 3" class="zoomable"></div>
                <div class="img-wrapper"><img src="assets/4.jpg" alt="Hasil 4" class="zoomable"></div>
                <div class="img-wrapper"><img src="assets/5.jpg" alt="Hasil 5" class="zoomable"></div>
                <div class="img-wrapper"><img src="assets/6.jpg" alt="Hasil 6" class="zoomable"></div>
            </div>
        </section>

        <hr class="divider">

        <!-- Section Chat Testimoni -->
        <section class="gallery-section">
            <div class="section-title">
                <h2>💬 Chat Pelanggan</h2>
                <p>Ulasan jujur langsung dari WhatsApp pelanggan setia kami.</p>
            </div>
            <!-- Dibuat 1 kolom besar agar teks mudah dibaca bapak-bapak -->
            <div class="grid-gallery-1">
                <!-- Diperbanyak slot chat WhatsApp -->
                <div class="img-wrapper"><img src="assets/7.jpg" alt="Testimoni 1" class="zoomable"></div>
                <div class="img-wrapper"><img src="assets/8.jpeg" alt="Testimoni 2" class="zoomable"></div>
                <div class="img-wrapper"><img src="assets/9.jpeg" alt="Testimoni 3" class="zoomable"></div>
                <div class="img-wrapper"><img src="assets/10.jpeg" alt="Testimoni 4" class="zoomable"></div>
                <div class="img-wrapper"><img src="assets/11.jpeg" alt="Testimoni 5" class="zoomable"></div>
                <div class="img-wrapper"><img src="assets/12.jpeg" alt="Testimoni 6" class="zoomable"></div>
                <div class="img-wrapper"><img src="assets/13.jpeg" alt="Testimoni 7" class="zoomable"></div>
                <div class="img-wrapper"><img src="assets/14.jpeg" alt="Testimoni 8" class="zoomable"></div>
            </div>
        </section>
        
        <div class="bottom-spacer"></div>
    </main>

    <!-- Modal Lightbox -->
    <div id="imageModal" class="modal">
        <span class="close-btn">&times;</span>
        <img class="modal-content" id="zoomedImg" alt="Gambar Diperbesar">
    </div>

    <!-- Floating CTA Button -->
    <div class="sticky-footer">
        <a href="javascript:history.back()" class="cta-button">TUTUP & KEMBALI KE WA</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
